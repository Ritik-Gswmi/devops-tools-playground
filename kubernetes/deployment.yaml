apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-playground
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-playground
  template:
    metadata:
      labels:
        app: devops-playground
    spec:
      containers:
        - name: app
          image: devops-tools-playground:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: devops-playground-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
